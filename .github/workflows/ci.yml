name: CI

# ---------------------------------------------------------------------
# Phase 9 — CI/CD.
# Lint + typecheck + build on every push/PR. Vercel handles actual
# deployment via its native GitHub integration (auto-deploy on push
# to main = production, PR previews = preview deployments), so this
# workflow focuses on quality gates that block a bad merge; it does
# not duplicate deployment (avoids double-deploy / secret sprawl).
# An optional explicit Vercel CLI deploy job is included below,
# disabled by default, for teams that prefer to disable Vercel's
# GitHub auto-deploy and drive deployment purely from Actions.
# ---------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: maison-oleria/package-lock.json

      - name: Install dependencies
        working-directory: maison-oleria
        run: npm ci

      - name: Lint (ESLint)
        working-directory: maison-oleria
        run: npm run lint

      - name: Typecheck (TypeScript)
        working-directory: maison-oleria
        run: npm run typecheck

      - name: Prisma generate
        working-directory: maison-oleria
        run: npx prisma generate

      - name: Build (Next.js)
        working-directory: maison-oleria
        env:
          # Dummy values so `next build` can statically analyze routes
          # without live secrets. Real secrets are injected by Vercel
          # at actual deploy time, not by this CI job.
          DATABASE_URL: "postgresql://user:password@localhost:5432/ci"
          DIRECT_URL: "postgresql://user:password@localhost:5432/ci"
          SESSION_SECRET: "ci-placeholder-secret-not-used-in-production"
          NEXT_PUBLIC_SITE_URL: "https://maison-oleria.com"
        run: npm run build

  # -----------------------------------------------------------------
  # Optional: explicit Vercel deploy via CLI, only runs on main and
  # only if VERCEL_TOKEN/ORG_ID/PROJECT_ID secrets are configured.
  # Leave disabled (or remove) if relying on Vercel's native Git
  # integration for auto-deploy, which is the default/recommended
  # path for this project.
  # -----------------------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel (optional)
    needs: lint-typecheck-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_VERCEL_CLI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via Vercel CLI
        working-directory: maison-oleria
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --token=$VERCEL_TOKEN

